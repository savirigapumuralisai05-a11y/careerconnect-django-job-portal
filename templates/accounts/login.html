{% extends "base.html" %}{% block title %}Log in · CareerConnect{% endblock %}
{% block content %}
<div class="form-card mx-auto">
  <h1 class="h3 mb-2">Welcome back</h1><p class="text-muted">Log in to CareerConnect.</p>
  {% if form.errors %}<div class="alert alert-danger">Username or password is incorrect.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="mb-3"><label class="form-label" for="id_username">Username</label><input class="form-control" id="id_username" name="username" required autofocus></div>
    <div class="mb-3"><label class="form-label" for="id_password">Password</label><input class="form-control" type="password" id="id_password" name="password" required></div>
    <button class="btn btn-primary w-100">Log in</button>
  </form>
  <p class="mt-3 mb-0">New here? <a href="{% url 'register' %}">Create account</a></p>
</div>{% endblock %}
